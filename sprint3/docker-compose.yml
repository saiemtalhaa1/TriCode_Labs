services:
  db:
    image: mysql:8.0
    container_name: outfitshare-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: outfitshare
      MYSQL_USER: outfitshare_user
      MYSQL_PASSWORD: outfitshare_pass
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: outfitshare-app
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app
      - /app/node_modules
    environment:
      DB_HOST: db
      DB_USER: outfitshare_user
      DB_PASSWORD: outfitshare_pass
      DB_NAME: outfitshare
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "nodemon", "index.js"]

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: outfitshare-phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: outfitshare_user
      PMA_PASSWORD: outfitshare_pass
    depends_on:
      - db

volumes:
  db_data:
